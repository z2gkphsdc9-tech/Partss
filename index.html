html,body{margin:0}

main{max-width:720px;margin:0 auto}

.chip[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.count{color:var(--mute);font-size:.88rem;margin:0 0 8px}

.lbl{font-size:.78rem;color:var(--mute)}

.note{margin-top:8px;font-size:.86rem;color:var(--mute)}

.ph img{width:100%;height:100%;object-fit:contain}
.sheet a,.sheet button{display:block;width:100%;flex:1;text-align:center;font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px;margin-top:8px;cursor:pointer;text-decoration:none;background:var(--chip);color:var(--ink)}
.sheet .go{background:var(--acc);color:var(--accink)}
.sv{position:relative;overflow:hidden;background:#fff;border-radius:10px;width:100%}
.si{position:absolute;left:0;top:0;transform-origin:0 0}
.si img{display:block;width:100%;height:auto}
.hb{position:absolute;border:3px solid #e11d2a;background:rgba(225,29,42,.2);border-radius:8px;box-shadow:0 0 0 2px #fff;animation:pl 1.4s ease-in-out infinite}

.seg{display:flex;gap:6px;margin:0 0 8px}

.guide[open] summary::after{content:"\2013"}

.tag{display:inline-block;background:var(--chip);color:var(--mute);font-size:.78rem;padding:2px 8px;border-radius:99px;margin-top:6px}
.steps{margin:12px 0 0;padding-left:1.4em}

.steps img{display:block;width:100%;height:auto;border-radius:8px;margin-top:8px;background:#fff}
.guide h4{margin:16px 0 0;font-size:1rem}

.src{display:block;margin-top:12px;text-align:center;text-decoration:none;font-weight:600;background:var(--acc);color:var(--accink);padding:12px 14px;border-radius:8px;word-break:break-word}
.gvid{display:block;width:100%;max-width:420px;height:auto;border-radius:10px;margin:8px auto;background:#000}
.gimg{display:block;width:100%;max-width:420px;height:auto;border-radius:10px;margin:8px auto}
.txt{white-space:pre-line;line-height:1.55;word-break:break-word;margin-top:6px}
.txt a{color:var(--acc);font-weight:600;word-break:break-all}
.src.alt{background:var(--chip);color:var(--ink)}
.src.nolink{background:var(--chip);color:var(--ink);text-align:left;font-weight:600}

 text:"🚨Точки на тахометре синяя, зеленая, 2 белых. \n\nРасшифровка:\n\nИнтеллектуальный мастер привода (i-DM)\n«I-DM» — это система поддержки вождения, которая позволяет в полной мере ощутить «удовольствие от вождения» и «отличные показатели экологической безопасности» автомобилей Mazda. \nГлавный индикатор интеллектуального привода -диагностирует состояние вождения (акселератор, тормоз, рулевое колесо) во время движения и информирует водителя о состоянии вождения по цвету лампы.\n\n✅Зеленая лампа - демонстрирует легкое вождение. Медленная езда, меньшая тряска тела пассажира, стабильное вождение и хорошая экономия топлива.\n\n 🔵Синяя лампа - демонстрирует плавное (стабильное) вождение, когда автомобиль и пассажир движутся вместе с плавным движением при умеренном изменении ускорения.\n\n🌟Белая лампа -  указывает на  слегка резкое или нестабильное вождение, которое сотрясает тело. Увеличенный расход топлива"},

{cat:"Электрика",car:"Mazda с i-Stop",name:"Замена АКБ с i-Stop",kw:"акб,аккумулятор,замена акб,замена аккумулятора,i-stop,istop,айстоп,инициализация,клемма,датчик тока,окна,стеклоподъемники,напряжение",
 docs:[{t:"Исходный файл (PDF)",u:"battery-istop.pdf",alt:1}],
 text:"**Инициализация i-Stop**\n1. Убедится что напряжение в новом аккуме находится в диапазоне 12,5-12,7 вольт;\n2. Скинуть минусовую клемму;\n3. Отсоединить датчик тока от минусовой клеммы;\n4. Скинуть плюсовую клемму;\n5. Снимаем аккумулятор;\n6. Выждать 5 минут без аккумулятора;\n7. Ставим новый аккумулятор;\n8. Накидываем плюсовую клемму;\n9. Одеть минусовую клемму на аккумулятор **(без датчика тока)** и выждать 15 секунд;\n10. Подсоединить датчик тока;\n11. Включаем зажигание и ждем 1 мин;\n12. Нажимаем кнопку i-Stop OFF и держим ее 10 секунд - индикатор айстоп должен замигать зеленым;\n13. **Если индикатор не мигает зеленым то начинаем всю процедуру с пункта №9. Если напряжение в АКБ низкое то можно просто завести машину и подождать пока АКБ подзарядиться. Если напряжение в АКБ более 12,7 вольт то включить фары на 15-30 сек.;**\n14. Если индикатор замигал зеленым цветом то можно закрывать капот **(до этого момента капот должен оставаться открытым)**;\n15. Заводим автомобиль;\n16. Дождаться пока погаснет синий индикатор прогрева двигателя (если двигатель не прогрет);\n17. Поворачиваем руль от упора до упора: вправо, затем влево, и выставляем на центр;\n18. Глушим автомобиль;\n19. Включаем зажигание - нажимаем кнопку i-Stop на 3 сек - заводим машину - кратковременно нажимаем кнопку i-Stop - **должен замигать индикатор i-Stop зеленым цветом**;\n20. Ждем до момента когда индикатор i-Stop погаснет;\n21. Опустить все окна (по одному) вниз - задержать на 3 сек - поднять вверх - задержать на 3 сек - **для инициализации автоматического подъема окон. Если на АВТО только водительское окно, то соответственно делаем эту процедуру только с ним.**"},
{cat:"Мультимедиа",car:"MZD Connect: Axela, CX-3, Demio",name:"Русификация ГУ",kw:"русификация,русификация гу,гу,мультимедиа,магнитола,прошивка,язык,русский язык,флешка,fat32,версия 70,версия 74,кирпич,аксела,сх3,демио",

 docs:[{t:"Официальный бюллетень Mazda (PDF, на русском)",u:"mzd-connect-update.pdf",alt:1}],
 img:"rusification-buttons.jpg",
 text:"Русификация мультимедиа ‼️\n\n🔴1. Берете флешку от 4 гб до 32\n🔴2.Форматируете ее на компе в формате Fat32\n🔴3. Скачиваете этот файл по этой ссылки 👉🏻\nЭто версия прошивки 70\nhttps://drive.google.com/drive/folders/1_g-miquLiBBcLT_2cCq9GAqCYRQnunJQ?usp=share_link\n\nЛибо по этой 74 версия https://drive.google.com/file/d/1_RoirvyDoFUkg7MQegq20Ls7AIjl3f5o/edit\n\n❗Важно, смотрим версию своей прошивки, если она выше чем 70.367 вам нужна прошивка выше номером. Если ниже то лучше сначала поставьте 70 а потом уже 74\n\n🔴4. Закачиваете на флешку уже форматированию с формате Fat 32\n🔴5. Идете в авто вставляете флешку в порт usb\n🔴6. Включаете первое положение зажигания (но говорят можно и на заведеную) но я так не делал.\n🔴7. Зажимаете 3 кнопки одновременно как на картинке ☝️\nкнопки на картинке могут отличаться, но суть их одна и все они обозначены одинаково\n🔴8. После зажатия вылезет окно где нужно везти 3 enter clear 2 enter clear 99 enter\nВыбрать 70.367 ну название файла, скачаете выше прошивку, значит выше цифры будут\nИ как начнется загрузка, нажимаете каждые 5-10 минут тормоз, либо открываете-закрываете водительскую дверь, чтобы машина не ушла в сон, вся эта загрузка идет минут 40-45 после завершения выключите зажигание вытащите флешку и в настройках меняйте язык.\n\n❗️Дополнительно: если у вас не работает экран, не реагирует сенсор на прикосновения, момент в сервисном меню проходите шайбой. Шайбой выбираете цифры нажимаете на шайбу, потом следующие снова на шайбу и т.д.\n\n🚨Важно если у вас версия 59.00.545 то надо ставить сначала 70 версию двухфайловую иначе можно схватить кирпич. С остальными проблем нет можно сразу 74"},

let mode="parts";

function buildCars(){
  $("#cars").innerHTML=Object.keys(CARS).map(k=>`<button class="car" aria-pressed="${k===car}" data-k="${k}">${CARS[k].t}</button>`).join("");
  const ax=car==="axela";
  $("#tabs").hidden=!ax;
  $("#tabs").innerHTML=ax?[["orig","Дизель"],["sidem","Каталог Sidem"]].map(([k,t])=>`<button class="car" aria-pressed="${k===tab}" data-k="${k}">${t}</button>`).join(""):"";
  $("#carinfo").textContent=(tab==="sidem"&&ax)?SIDEM_INFO:CARS[car].d;
}
function buildCats(){
  const cs=["Все",...new Set(cur().map(p=>p.cat))];
  $("#cats").hidden=mode==="guides"&&cs.length<2;
  $("#cats").innerHTML=cs.map(c=>{const v=c==="Все"?"":c;return `<button class="chip" aria-pressed="${v===cat}" data-c="${v}">${c}</button>`}).join("");
}
function match(p,q){
  if(!q)return true;
  const hay=norm([p.name,p.cat,p.kw].join(" "));
  const nums=key(p.n.map(a=>a[0]+a[1]).join(" "));
  return norm(q).split(/\s+/).every(w=>hay.includes(w)||(key(w).length>1&&nums.includes(key(w))));
}
function buildModes(){
  $("#modes").innerHTML=[["parts","Запчасти"],["guides","Инструкции"]].map(([k,t])=>`<button class="car" aria-pressed="${k===mode}" data-k="${k}">${t}</button>`).join("");
}
function applyMode(){
  const g=mode==="guides";
  $("#sub").textContent=g?"Пошаговые инструкции по обслуживанию и ремонту. Введите слово для поиска.":SUB;
  $("#q").placeholder=g?"Найти инструкцию":"Что ищем?";
  $("#cars").hidden=g;
  $("#tabs").hidden=g||car!=="axela";
  $("#carinfo").hidden=g;
  $("#foot").hidden=g;
}
function stepsHtml(a,ul){const T=ul?"ul":"ol";return `<${T} class="steps">${(a||[]).map(s=>{const t=typeof s==="string"?s:s.t;return `<li>${esc(t)}${s.img?`<img src="${esc(s.img)}" alt="" loading="lazy">`:""}</li>`}).join("")}</${T}>`}
function tableHtml(t){return `<div class="tw"><table class="ft"><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}${r[4]?`<div class="lbl">${esc(r[4])}</div>`:""}</td></tr>`).join("")}</tbody></table></div>`}
function linkify(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}
function renderGuides(){
  const q=norm($("#q").value);
  const all=g=>g.sections?g.sections.flatMap(x=>[x.h,...(x.table?x.table.rows.flat():x.steps)]):(g.steps||[]);
  const txt=g=>norm([g.name,g.cat,g.car||"",g.kw||"",g.text||"",all(g).map(x=>x.t||x).join(" ")].join(" "));
  const r=GUIDES.filter(g=>(!cat||g.cat===cat)&&(!q||q.split(/\s+/).every(w=>txt(g).includes(w))));
  $("#count").textContent=r.length?`Найдено: ${r.length}`:"";
  $("#list").innerHTML=r.length?r.map(g=>`<details class="card guide"><summary><div><h3>${esc(g.name)}</h3>${g.car?`<span class="tag">${esc(g.car)}</span>`:""}</div></summary>
<div class="body">${g.src?(g.src.u?`<a class="src" href="${esc(g.src.u)}" target="_blank" rel="noopener">Источник: ${esc(g.src.t)} ↗</a>`:`<div class="src nolink">Источник: ${esc(g.src.t)}</div>`):""}
${g.warn?`<div class="warn${g.warnHot?" hot":""}">${linkify(g.warn)}</div>`:""}
${g.docs?g.docs.map(d=>`<a class="src${d.alt?" alt":""}" href="${esc(d.u)}" target="_blank" rel="noopener">${esc(d.t)} ↗</a>`).join(""):""}
${g.video?`<video class="gvid" controls playsinline preload="metadata"${g.poster?` poster="${esc(g.poster)}"`:""} src="${esc(g.video)}"></video>`:""}
${(g.imgs||(g.img?[g.img]:[])).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img class="gimg" src="${esc(u)}" alt="${esc(g.name)}" loading="lazy"></a>`).join("")}
${g.text?`<div class="txt">${linkify(g.text)}</div>`:""}
${g.parts?g.parts.map(x=>x.img?`<a href="${esc(x.img)}" target="_blank" rel="noopener"><img class="gimg" src="${esc(x.img)}" alt="${esc(g.name)}" loading="lazy"></a>`:`<div class="txt">${linkify(x.t)}</div>`).join(""):""}
${g.sections?g.sections.map(x=>`<h4>${esc(x.h)}</h4>${x.table?tableHtml(x.table):stepsHtml(x.steps,x.bullets)}`).join(""):stepsHtml(g.steps)}
${g.note?`<div class="note">${esc(g.note)}</div>`:""}</div></details>`).join(""):
  `<div class="empty">${GUIDES.length?"Ничего не найдено. Попробуйте другое слово.":"Инструкций пока нет. Скоро здесь появятся пошаговые инструкции."}</div>`;
}
function refresh(){buildModes();buildCars();buildCats();applyMode();render()}
function render(){
  if(mode==="guides")return renderGuides();
  const q=$("#q").value;
  const r=cur().filter(p=>match(p,q)&&(!cat||p.cat===cat));
  $("#count").textContent=r.length?`Найдено: ${r.length}`:"";
  $("#list").innerHTML=r.length?r.map(p=>{
    const [l,v]=p.n[0],rest=p.n.slice(1);
    return `<article class="card"><h3>${esc(p.name)}</h3>
<div class="oem"><div><div class="lbl">${esc(l)}</div><div class="num">${esc(v)}</div></div><div class="btns">${tab==="sidem"?`<button class="copy sec" data-photo="${esc(v)}">Схема</button>`:""}<button class="copy" data-n="${esc(v)}">Копировать</button></div></div>
${rest.length?`<ul class="an">${rest.map(a=>`<li data-n="${esc(a[1])}"><span>${esc(a[0])}</span><b>${esc(a[1])}</b></li>`).join("")}</ul>`:""}
${p.note?`<div class="note">${esc(p.note)}</div>`:""}</article>`}).join(""):
  `<div class="empty">Ничего не найдено. Попробуйте другое слово («колодки», «фильтр») или выберите «Все».</div>`;
}
const MID="67c9c222-7f15-4b59-af1b-3b022c384894";
const MODELPAGE="https://catalogue.sidem.eu/en/catalogue/mazda-mazda-3/285-286-2069/";
const SLUG={"851810":"stabilizer-mounting-851810","851909":"stabilizer-mounting-851909","51364":"stabilizer-link-left-51364","51365":"stabilizer-link-right-51365","51362":"stabilizer-link-left-51362","51363":"stabilizer-link-right-51363","851411":"top-strut-mounting-851411","351.133":"steering-rack-gaiter-351.133","51812":"axial-joint-51812","51936":"tie-rod-end-left-51936","51937":"tie-rod-end-right-51937","51678":"track-control-arm-left-wbj-51678","51679":"track-control-arm-right-wbj-51679","851640":"silentblock-for-track-control-arm-851640","851649":"silentblock-for-track-control-arm-851649","851705":"silentblock-for-track-control-arm-851705","851706":"silentblock-for-track-control-arm-851706","851638":"silentblock-for-tca-left-851638","851639":"silentblock-for-tca-right-851639","51282 R":"ball-joint-51282%20R","51676":"transverse-link-51676","51677":"transverse-link-51677"};
const IMG={w:1187,h:1340};
const BOX={"851810": [[450, 52, 125, 125], [635, 52, 125, 125]], "51364": [[255, 55, 110, 242]], "51365": [[842, 55, 110, 242]], "851411": [[153, 83, 120, 102], [932, 83, 126, 102]], "351.133": [[368, 238, 220, 102], [608, 238, 220, 102]], "51812": [[293, 343, 282, 78], [610, 343, 302, 78]], "51936": [[65, 308, 218, 112]], "51937": [[918, 308, 220, 112]], "851640": [[543, 433, 118, 120]], "51678": [[80, 420, 395, 345]], "51679": [[728, 420, 392, 345]], "851638": [[448, 576, 145, 135]], "851639": [[605, 576, 148, 135]], "851649": [[543, 712, 118, 118]], "51282 R": [[50, 676, 128, 145], [1028, 676, 125, 145]], "51676": [[148, 840, 275, 172], [806, 840, 282, 172]], "851705": [[83, 932, 118, 112], [1005, 932, 118, 112]], "851706": [[364, 928, 118, 115], [742, 928, 120, 115]], "51677": [[138, 1048, 285, 86], [806, 1048, 285, 86]], "51362": [[205, 1136, 105, 195]], "51363": [[888, 1136, 106, 195]], "851909": [[433, 1188, 118, 130], [660, 1188, 118, 130]]};
function drawSchema(art,full){
  const v=$("#sv"),si=$("#si");if(!v)return;
  const bx=BOX[art]||[],cw=v.clientWidth;
  let X=0,Y=0,W=IMG.w,H=IMG.h;
  if(!full&&bx.length){
    const x1=Math.min(...bx.map(b=>b[0]))-45,y1=Math.min(...bx.map(b=>b[1]))-45,
          x2=Math.max(...bx.map(b=>b[0]+b[2]))+45,y2=Math.max(...bx.map(b=>b[1]+b[3]))+45;
    X=Math.max(0,x1);Y=Math.max(0,y1);W=Math.min(IMG.w,x2)-X;H=Math.min(IMG.h,y2)-Y;
  }
  const sc=Math.min(cw/W,(full?900:460)/H);
  v.style.height=H*sc+"px";
  si.style.width=IMG.w*sc+"px";
  si.style.transform=`translate(${-X*sc+(cw-W*sc)/2}px,${-Y*sc}px)`;
}
function openPhoto(art){
  const p=cur().find(x=>x.n.some(a=>a[1]===art));if(!p)return;
  const slug=SLUG[art],bx=BOX[art]||[];
  const img="https://cdn.sidem.be/ItemThumbnail/"+encodeURIComponent(art)+".jpg";
  const hb=bx.map(b=>`<div class="hb" style="left:${b[0]/IMG.w*100}%;top:${b[1]/IMG.h*100}%;width:${b[2]/IMG.w*100}%;height:${b[3]/IMG.h*100}%"></div>`).join("");
  $("#sheet").innerHTML=`<h3>${esc(p.name)}</h3>
<div class="hl">${esc(art)}</div>${p.pos?`<span class="others"> позиция ${p.pos} на схеме</span>`:""}
<div class="seg"><button id="tS" aria-pressed="true">Схема</button><button id="tP" aria-pressed="false">Фото</button></div>
<div id="vS"><div class="sv" id="sv"><div class="si" id="si"><img src="sidem.jpg" alt="Схема Mazda 3 BM/BN">${hb}</div></div>
<button id="zoom">Показать всю схему</button></div>
<div id="vP" hidden><div class="ph" id="ph"></div></div>
${p.note?`<div class="others">${esc(p.note)}</div>`:""}
<button id="mcopy">Копировать номер</button>
${slug?`<a class="go" href="https://catalogue.sidem.eu/en/catalogue-detail/${slug}/?modelId=${MID}" target="_blank" rel="noopener">Открыть деталь в каталоге Sidem</a>`:""}
<button id="mclose">Закрыть</button>`;
  $("#modal").hidden=false;
  let full=false;
  $("#si img").onerror=()=>{$("#sv").style.height="auto";$("#sv").textContent="Схема не загрузилась: проверьте, что файл sidem.jpg лежит в репозитории рядом с index.html."};
  $("#si img").onload=()=>drawSchema(art,full);
  drawSchema(art,full);
  $("#zoom").onclick=e=>{full=!full;e.target.textContent=full?"Приблизить деталь":"Показать всю схему";drawSchema(art,full)};
  $("#tS").onclick=()=>{$("#vS").hidden=false;$("#vP").hidden=true;$("#tS").setAttribute("aria-pressed","true");$("#tP").setAttribute("aria-pressed","false");drawSchema(art,full)};
  $("#tP").onclick=()=>{$("#vS").hidden=true;$("#vP").hidden=false;$("#tP").setAttribute("aria-pressed","true");$("#tS").setAttribute("aria-pressed","false");
    if(!$("#ph").firstChild){const im=new Image();im.referrerPolicy="no-referrer";im.alt=p.name;im.onerror=()=>{$("#ph").textContent="Фото не загрузилось. Откройте деталь в каталоге Sidem кнопкой ниже."};im.src=img;$("#ph").appendChild(im)}};
  $("#mcopy").onclick=e=>copy(art,e.target,"Копировать номер");
  $("#mclose").onclick=closeM;
}
function closeM(){$("#modal").hidden=true}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
function copy(t,el,orig){
  const done=()=>{if(el.classList.contains("copy")){el.textContent="Скопировано";setTimeout(()=>el.textContent=orig,1200)}};
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done,done);
}
$("#cars").onclick=e=>{const b=e.target.closest("button");if(!b)return;car=b.dataset.k;tab="orig";cat="";
  try{localStorage.setItem("car",car)}catch(err){}
  buildCars();buildCats();render()};
$("#q").oninput=render;
$("#modes").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.k;cat="";$("#q").value="";refresh()};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.k;cat="";buildCars();buildCats();render()};
$("#cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;buildCats();render()};
$("#list").onclick=e=>{const ph=e.target.closest("[data-photo]");if(ph){openPhoto(ph.dataset.photo);return}const el=e.target.closest("[data-n]");if(el)copy(el.dataset.n,el,"Копировать")};
refresh();
</script>
